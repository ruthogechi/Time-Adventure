<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Adventure! 🕒</title>
<style>
:root{
  --bg1:#7c4dbc;--bg2:#b79af0;--card:#f6efff;--ink:#3b1d6e;
  --pink:#ff7eb6;--yellow:#ffd54a;--sky:#59c8f5;--good:#3cc48a;--bad:#ff8fb0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink);background:radial-gradient(circle at 20% 10%,#c9b3f7 0,transparent 45%),linear-gradient(160deg,var(--bg2),var(--bg1));
  background-attachment:fixed;overflow-x:hidden;
}
.deco{position:fixed;font-size:2rem;opacity:.85;pointer-events:none;user-select:none}
.d1{top:6%;left:5%}.d2{top:12%;right:6%;font-size:2.4rem}.d3{bottom:9%;left:7%}.d4{bottom:14%;right:5%;font-size:2.4rem}.d5{top:46%;left:2%;font-size:1.5rem}.d6{top:55%;right:2%;font-size:1.5rem}
main{position:relative;max-width:560px;margin:0 auto;padding:14px 14px 28px;text-align:center}
h1{margin:6px 0 8px;font-size:clamp(2rem,8vw,2.8rem);color:#fff;text-shadow:0 3px 0 #5b2f9e}
.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{background:var(--yellow);color:#5b2f9e;font-weight:800;font-size:1.25rem;padding:8px 16px;border-radius:999px;border:3px solid #fff}
.pill.sky{background:var(--sky)}
.card{background:var(--card);border-radius:32px;padding:16px 14px 18px;border:4px solid #fff;box-shadow:0 8px 0 #5b2f9e55}
.q{font-size:clamp(1.7rem,7vw,2.3rem);font-weight:800;margin:4px 0 6px}
.kids{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.kid{width:21%;max-width:90px;flex:none}
.clockwrap{flex:1;min-width:0;position:relative}
#clock{width:100%;height:auto;display:block;max-width:300px;margin:0 auto}
#answers{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.ans{
  font:inherit;font-size:clamp(1.4rem,6vw,1.8rem);font-weight:800;color:#fff;border:4px solid #fff;border-radius:24px;
  min-height:68px;padding:10px 14px;cursor:pointer;box-shadow:0 6px 0 rgba(59,29,110,.35);touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;transition:transform .08s;
}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,29,110,.35)}
.ans:focus-visible,#next:focus-visible,#again:focus-visible{outline:5px solid #3b1d6e;outline-offset:3px}
.right-side{display:flex;gap:8px;align-items:center}
#snd{font:inherit;font-size:1.5rem;width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:var(--pink);cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 rgba(59,29,110,.35)}
#snd:active{transform:translateY(3px)}
.c0{background:var(--pink)}.c1{background:#f2a900}.c2{background:var(--sky)}.c3{background:#a77bf0}
.ans.right{background:var(--good)!important}
.ans.wrong{background:#c9b8e6!important;color:#6b4fa0}
.ans:disabled{cursor:default}
#msg{min-height:3.4rem;font-size:clamp(1.8rem,8vw,2.5rem);font-weight:800;margin:12px 0 2px;display:flex;align-items:center;justify-content:center}
#msg.good{color:#1f9a68;animation:pop .4s}
#msg.bad{color:#d6467f;animation:shake .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#next,#again{
  font:inherit;font-size:1.7rem;font-weight:800;color:#5b2f9e;background:var(--yellow);border:4px solid #fff;border-radius:999px;
  min-height:68px;padding:8px 30px;margin-top:6px;cursor:pointer;box-shadow:0 6px 0 rgba(59,29,110,.35);touch-action:manipulation;width:100%;
}
#next[hidden]{display:none}
.hide{display:none!important}
#end .big{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;margin:8px 0}
#stars{font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.3;word-break:break-all;margin:6px 0 10px}
.bounce{display:inline-block;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.conf{position:fixed;top:-30px;font-size:2rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bounce,.conf{animation:none}#msg.good,#msg.bad{animation:none}}
@media (min-width:600px){#answers{grid-template-columns:1fr 1fr}main{padding-top:24px}}
@media (prefers-color-scheme:dark){:root{--card:#f6efff;--ink:#3b1d6e}}
</style>
</head>
<body>
<span class="deco d1">⭐</span><span class="deco d2">🌙</span><span class="deco d3">✨</span><span class="deco d4">🦄</span><span class="deco d5">💜</span><span class="deco d6">⭐</span>
<main>
  <h1>Time Adventure! 🕒</h1>

  <section id="game">
    <div class="bar">
      <div class="pill sky" id="count">Question 1 of 12</div>
      <div class="right-side"><div class="pill" id="score">⭐ 0</div><button id="snd" type="button" aria-label="Sound on or off">🔊</button></div>
    </div>
    <div class="card">
      <div class="q" id="question">What time is it?</div>
      <div class="kids">
        <svg class="kid" viewBox="0 0 100 130" aria-hidden="true">
          <circle cx="50" cy="38" r="26" fill="#ffd9b8"/><path d="M22 36c0-22 18-30 30-28 14 2 26 12 26 28-8-4-14-12-18-16-8 10-24 14-38 16z" fill="#5b2f9e"/>
          <circle cx="40" cy="42" r="3.5" fill="#3b1d6e"/><circle cx="60" cy="42" r="3.5" fill="#3b1d6e"/><path d="M40 52q10 9 20 0" stroke="#3b1d6e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="33" cy="50" r="5" fill="#ff9fc4" opacity=".7"/><circle cx="67" cy="50" r="5" fill="#ff9fc4" opacity=".7"/>
          <path d="M26 128l6-52h36l6 52z" fill="#ff7eb6"/><circle cx="50" cy="92" r="5" fill="#ffd54a"/>
        </svg>
        <div class="clockwrap">
          <svg id="clock" viewBox="0 0 300 300" role="img" aria-label="Analogue clock">
            <circle cx="150" cy="150" r="140" fill="#59c8f5"/>
            <circle cx="150" cy="150" r="124" fill="#fffdf5" stroke="#ff7eb6" stroke-width="8"/>
            <g id="ticks"></g><g id="nums"></g>
            <line id="hh" x1="150" y1="150" x2="150" y2="95" stroke="#ff4d97" stroke-width="13" stroke-linecap="round"/>
            <line id="mh" x1="150" y1="150" x2="150" y2="52" stroke="#3b1d6e" stroke-width="9" stroke-linecap="round"/>
            <circle cx="150" cy="150" r="9" fill="#ffd54a" stroke="#3b1d6e" stroke-width="3"/>
            <circle cx="126" cy="178" r="4" fill="#3b1d6e"/><circle cx="174" cy="178" r="4" fill="#3b1d6e"/>
            <path id="smile" d="M130 192q20 16 40 0" stroke="#3b1d6e" stroke-width="5" fill="none" stroke-linecap="round"/>
            <circle cx="114" cy="190" r="6" fill="#ff9fc4" opacity=".7"/><circle cx="186" cy="190" r="6" fill="#ff9fc4" opacity=".7"/>
          </svg>
        </div>
        <svg class="kid" viewBox="0 0 100 130" aria-hidden="true">
          <circle cx="50" cy="38" r="26" fill="#f1c08f"/><circle cx="26" cy="20" r="11" fill="#2f1a55"/><circle cx="74" cy="20" r="11" fill="#2f1a55"/><path d="M24 36c2-20 16-26 26-26s24 6 26 26c-10-2-18-10-26-14-8 6-16 12-26 14z" fill="#2f1a55"/>
          <circle cx="40" cy="42" r="3.5" fill="#3b1d6e"/><circle cx="60" cy="42" r="3.5" fill="#3b1d6e"/><path d="M38 51q12 12 24 0z" fill="#fff" stroke="#3b1d6e" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="33" cy="50" r="5" fill="#ff9fc4" opacity=".7"/><circle cx="67" cy="50" r="5" fill="#ff9fc4" opacity=".7"/>
          <path d="M26 128l6-52h36l6 52z" fill="#59c8f5"/><path d="M50 82l5 9 10 1-7 7 2 10-10-5-10 5 2-10-7-7 10-1z" fill="#ffd54a"/>
        </svg>
      </div>
      <div id="answers"></div>
      <div id="msg" aria-live="polite"></div>
      <button id="next" hidden>Next Question ➡️</button>
    </div>
  </section>

  <section id="end" class="card hide">
    <div class="bounce" style="font-size:4rem">🎉</div>
    <div class="big">Hooray!</div>
    <div class="q" id="finalText"></div>
    <div id="stars"></div>
    <div class="q" id="praise"></div>
    <button id="again">Play Again 🔄</button>
  </section>
</main>

<script>
(function(){
  // Each question: hour, minute, and the correct label. Distractors are built from the 4 time types.
  var NUMWORDS=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
  function label(h,m){
    var next=h%12+1;
    if(m===0)return cap(NUMWORDS[h])+" o\u2019clock";
    if(m===15)return "Quarter past "+NUMWORDS[h];
    if(m===30)return "Half past "+NUMWORDS[h];
    if(m===45)return "Quarter to "+NUMWORDS[next];
  }
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

  // 12+ questions covering all four types (3 of each)
  var BANK=[
    [2,0],[7,0],[11,0],
    [2,15],[6,15],[9,15],
    [2,30],[5,30],[10,30],
    [2,45],[4,45],[8,45]
  ];
  var TYPES=[0,15,30,45];

  var $=function(id){return document.getElementById(id)};
  var qs,idx,score,answered;

  // ---- Sounds (made with Web Audio, no files needed) ----
  var audioCtx=null,soundOn=true;
  function ctx(){
    if(!soundOn)return null;
    try{
      if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}
      if(audioCtx.state==="suspended")audioCtx.resume();
      return audioCtx;
    }catch(e){return null}
  }
  function tone(freq,start,dur,type,vol){
    var c=ctx();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+start;
    o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
  }
  function playCorrect(){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.25,"triangle",0.28)})}
  function playWrong(){tone(330,0,0.22,"sine",0.25);tone(262,0.2,0.35,"sine",0.25)}
  function playWin(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*0.14,0.3,"triangle",0.28)})}
  $("snd").addEventListener("click",function(){
    soundOn=!soundOn;
    this.textContent=soundOn?"\uD83D\uDD0A":"\uD83D\uDD07";
    if(soundOn)tone(784,0,0.15,"triangle",0.25);
  });

  // Build clock face once
  (function(){
    var ns="http://www.w3.org/2000/svg",t=$("ticks"),n=$("nums");
    for(var i=0;i<60;i++){
      var a=i*6*Math.PI/180,big=i%5===0,r1=big?108:114,r2=120;
      var l=document.createElementNS(ns,"line");
      l.setAttribute("x1",150+r1*Math.sin(a));l.setAttribute("y1",150-r1*Math.cos(a));
      l.setAttribute("x2",150+r2*Math.sin(a));l.setAttribute("y2",150-r2*Math.cos(a));
      l.setAttribute("stroke","#b79af0");l.setAttribute("stroke-width",big?4:2);l.setAttribute("stroke-linecap","round");
      t.appendChild(l);
    }
    for(var k=1;k<=12;k++){
      var b=k*30*Math.PI/180,x=150+88*Math.sin(b),y=150-88*Math.cos(b);
      var tx=document.createElementNS(ns,"text");
      tx.setAttribute("x",x);tx.setAttribute("y",y);tx.setAttribute("text-anchor","middle");tx.setAttribute("dominant-baseline","central");
      tx.setAttribute("font-size","30");tx.setAttribute("font-weight","800");tx.setAttribute("fill","#5b2f9e");
      tx.setAttribute("font-family","'Baloo 2','Comic Sans MS','Trebuchet MS',sans-serif");
      tx.textContent=k;n.appendChild(tx);
    }
  })();

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }

  function setClock(h,m){
    var mAng=m*6, hAng=(h%12)*30+m*0.5;
    $("mh").setAttribute("transform","rotate("+mAng+" 150 150)");
    $("hh").setAttribute("transform","rotate("+hAng+" 150 150)");
  }

  function start(){
    qs=shuffle(BANK.slice());idx=0;score=0;
    $("end").classList.add("hide");$("game").classList.remove("hide");
    show();
  }

  function show(){
    answered=false;
    var q=qs[idx],h=q[0],m=q[1],correct=label(h,m);
    setClock(h,m);
    $("count").textContent="Question "+(idx+1)+" of "+qs.length;
    $("score").textContent="\u2B50 "+score;
    $("msg").textContent="";$("msg").className="";
    $("next").hidden=true;
    // Distractors: same hour with the other three time types (always distinct, always wrong)
    var opts=[correct];
    TYPES.forEach(function(mm){ if(mm!==m) opts.push(label(h,mm)); });
    shuffle(opts);
    var box=$("answers");box.innerHTML="";
    opts.forEach(function(text,i){
      var b=document.createElement("button");
      b.type="button";b.className="ans c"+i;b.textContent=text;
      b.addEventListener("click",function(){choose(b,text===correct)});
      box.appendChild(b);
    });
  }

  function choose(btn,ok){
    if(answered)return;
    var msg=$("msg");
    if(ok){
      answered=true;score++;
      btn.classList.add("right");playCorrect();
      msg.textContent="Amazing! \u2B50";msg.className="good";
      $("score").textContent="\u2B50 "+score;
      Array.prototype.forEach.call($("answers").children,function(b){b.disabled=true});
      $("next").hidden=false;
      $("next").textContent=(idx===qs.length-1)?"See my stars! \uD83C\uDF1F":"Next Question \u27A1\uFE0F";
    }else{
      btn.classList.add("wrong");btn.disabled=true;playWrong();
      msg.textContent="Try again! \uD83D\uDC9C";msg.className="";
      void msg.offsetWidth;msg.className="bad";
    }
  }

  function finish(){
    $("game").classList.add("hide");$("end").classList.remove("hide");
    $("finalText").textContent="You got "+score+" out of "+qs.length+" stars!";
    var s="";for(var i=0;i<qs.length;i++){s+=(i<score?"\u2B50":"\u2606")}
    $("stars").textContent=s;
    $("praise").textContent=score===qs.length?"Perfect! You are a Time Superstar! \uD83C\uDF1F":"Great job, Time Explorer! \uD83D\uDC9C";
    confetti();playWin();window.scrollTo(0,0);
  }

  function confetti(){
    var em=["\u2B50","\uD83C\uDF89","\uD83D\uDC9C","\u2728","\uD83C\uDF88","\uD83E\uDD84"];
    for(var i=0;i<28;i++){
      var d=document.createElement("div");d.className="conf";d.textContent=em[i%em.length];
      d.style.left=(Math.random()*95)+"vw";d.style.animationDuration=(2.5+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*1.2)+"s";
      document.body.appendChild(d);
      setTimeout((function(el){return function(){el.remove()}})(d),7000);
    }
  }

  $("next").addEventListener("click",function(){
    if(idx<qs.length-1){idx++;show()}else{finish()}
  });
  $("again").addEventListener("click",start);

  start();
})();
</script>
</body>
</html>
